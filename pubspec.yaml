
name: easybosh_v2
description: "Application éducative pour les élèves en classe d'examen du Cameroun - Version 2"

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  font_awesome_flutter: ^10.7.0
  iconsax_flutter: ^1.0.0

  # Backend
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^6.0.0
  google_generative_ai: ^0.1.0 # Ajouté pour Gemini

  # State Management & Navigation
  go_router: ^16.2.4
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0 # Ajouté pour la génération de code Riverpod

  # Data Models
  equatable: ^2.0.5

  # UI Components
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.5
  
  # Utilities
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  permission_handler: ^11.3.1
  intl: ^0.18.1
  file_picker: ^10.3.3
  flutter_pdfview: # Added
  dio: ^5.4.3+1 
  path_provider: ^2.1.3 
  open_filex: ^4.7.0 # Version mise à jour selon la suggestion de pub get
  video_player: ^2.10.0
  audioplayers: ^6.5.1
  pdfx: ^2.9.2
  just_audio: ^0.10.5
  webview_flutter: ^4.8.0 # MODIFIED
  # webview_flutter_web: ^0.2.3+4 # REMOVED
  # flutter_riverpod: ^3.0.0 # Déjà présent
  chewie: ^1.8.0 # Added for improved video player UI

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.9 # Ajouté pour la génération de code
  riverpod_generator: ^3.0.0 # Ajouté pour la génération de code Riverpod

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Logo_Easybosh.png"
